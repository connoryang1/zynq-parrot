  <g id="text_22">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="62.928" y="34.56" transform="rotate(-0 62.928 34.56)">Four private corpora · 2 resident slots / 4 logical actors · normal L1D: 32 KiB</text>
  </g>
  <g id="text_23">
   <text style="font: 8.5px 'DejaVu Sans'; text-anchor: start" x="62.928" y="274.752" transform="rotate(-0 62.928 274.752)">Exclusive FIFO address ledger; fixed observed execution with no execution feedback.</text>
  </g>
  <g id="text_24">
   <text style="font: 8.5px 'DejaVu Sans'; text-anchor: start" x="62.928" y="289.9584" transform="rotate(-0 62.928 289.9584)">32 timed requests = 8 ring laps × 4 actors; 64 generated hash queries per request.</text>
  </g>
  <g id="text_25">
   <text style="font: 8.5px 'DejaVu Sans'; text-anchor: start" x="62.928" y="305.1648" transform="rotate(-0 62.928 305.1648)">Counts only: no speedup or FPGA projection; 1 KiB has no timed miss opportunities.</text>
  </g>
  <g id="text_26">
   <text style="font: 8.5px 'DejaVu Sans'; text-anchor: start" x="62.928" y="320.3712" transform="rotate(-0 62.928 320.3712)">Hypothetical 64 B victims are not equivalent to the FPGA’s four 16 B D-advisory segments.</text>
  </g>
